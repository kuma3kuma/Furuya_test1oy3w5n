<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densityDpi=device-dpi" />
        <title>AR Days of Week (Improved)</title>
        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

        <script>
            // 3Dモデルを自動回転させるコンポーネント（変更なし）
            AFRAME.registerComponent('auto-rotate', {
                schema: {
                    speedX: { type: 'number', default: 0 },
                    speedY: { type: 'number', default: 2 },
                    speedZ: { type: 'number', default: 0 }
                },
                tick: function (time, deltaTime) {
                    const rotation = this.el.object3D.rotation;
                    const delta = deltaTime / 1000;
                    rotation.x += this.data.speedX * delta;
                    rotation.y += this.data.speedY * delta;
                    rotation.z += this.data.speedZ * delta;
                }
            });
        </script>

        <style>
            .message {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: white;
                padding: 10px 20px;
                border-radius: 5px;
                z-index: 9999;
                text-align: center;
            }
        </style>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <div id="message" class="message">読み込み中...</div>

        <a-scene
            vr-mode-ui="enabled: false"
            renderer="logarithmicDepthBuffer: true;"
            embedded
            gesture-detector
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

            <a-assets>
                <a-asset-item id="model_mon" src="assets/pb_mon.glb"></a-asset-item>
                <a-asset-item id="model_tue" src="assets/pb_tue.glb"></a-asset-item>
                <a-asset-item id="model_wed" src="assets/pb_wed.glb"></a-asset-item>
                <a-asset-item id="model_thu" src="assets/pb_thu.glb"></a-asset-item>
                <a-asset-item id="model_fri" src="assets/pb_fri.glb"></a-asset-item>
                <a-asset-item id="model_sat" src="assets/pb_sat.glb"></a-asset-item>
                <a-asset-item id="model_sun" src="assets/pb_sun.glb"></a-asset-item>

                <audio id="audio_mon" src="assets/mon.mp3" preload="auto"></audio>
                <audio id="audio_tue" src="assets/tue.mp3" preload="auto"></audio>
                <audio id="audio_wed" src="assets/wed.mp3" preload="auto"></audio>
                <audio id="audio_thu" src="assets/thu.mp3" preload="auto"></audio>
                <audio id="audio_fri" src="assets/fri.mp3" preload="auto"></audio>
                <audio id="audio_sat" src="assets/sat.mp3" preload="auto"></audio>
                <audio id="audio_sun" src="assets/sun.mp3" preload="auto"></audio>
            </a-assets>

            <a-marker preset="pattern" type="pattern" url="assets/marker_mon.patt" id="marker_mon">
                <a-entity gltf-model="#model_mon" scale="0.2 0.2 0.2" position="0 0 0" auto-rotate="speedY: 1;" gesture-handler="rotationFactor: 10; minScale: 0.1; maxScale: 1.0;"></a-entity>
            </a-marker>
            <a-marker preset="pattern" type="pattern" url="assets/marker_tue.patt" id="marker_tue">
                <a-entity gltf-model="#model_tue" scale="0.2 0.2 0.2" position="0 0 0" auto-rotate="speedY: 1;" gesture-handler="rotationFactor: 10; minScale: 0.1; maxScale: 1.0;"></a-entity>
            </a-marker>
            <a-marker preset="pattern" type="pattern" url="assets/marker_wed.patt" id="marker_wed">
                <a-entity gltf-model="#model_wed" scale="0.2 0.2 0.2" position="0 0 0" auto-rotate="speedY: 1;" gesture-handler="rotationFactor: 10; minScale: 0.1; maxScale: 1.0;"></a-entity>
            </a-marker>
            <a-marker preset="pattern" type="pattern" url="assets/marker_thu.patt" id="marker_thu">
                <a-entity gltf-model="#model_thu" scale="0.2 0.2 0.2" position="0 0 0" auto-rotate="speedY: 1;" gesture-handler="rotationFactor: 10; minScale: 0.1; maxScale: 1.0;"></a-entity>
            </a-marker>
            <a-marker preset="pattern" type="pattern" url="assets/marker_fri.patt" id="marker_fri">
                <a-entity gltf-model="#model_fri" scale="0.2 0.2 0.2" position="0 0 0" auto-rotate="speedY: 1;" gesture-handler="rotationFactor: 10; minScale: 0.1; maxScale: 1.0;"></a-entity>
            </a-marker>
            <a-marker preset="pattern" type="pattern" url="assets/marker_sat.patt" id="marker_sat">
                <a-entity gltf-model="#model_sat" scale="0.2 0.2 0.2" position="0 0 0" auto-rotate="speedY: 1;" gesture-handler="rotationFactor: 10; minScale: 0.1; maxScale: 1.0;"></a-entity>
            </a-marker>
            <a-marker preset="pattern" type="pattern" url="assets/marker_sun.patt" id="marker_sun">
                <a-entity gltf-model="#model_sun" scale="0.2 0.2 0.2" position="0 0 0" auto-rotate="speedY: 1;" gesture-handler="rotationFactor: 10; minScale: 0.1; maxScale: 1.0;"></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const sceneEl = document.querySelector('a-scene');
                const messageEl = document.getElementById('message');

                // シーンの読み込み完了を待ってから処理を開始
                sceneEl.addEventListener('loaded', () => {
                    messageEl.textContent = 'マーカーをかざしてください';
                });

                const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

                days.forEach(day => {
                    const marker = document.querySelector(`#marker_${day}`);
                    const audio = document.querySelector(`#audio_${day}`);

                    if (marker && audio) {
                        // マーカーが見つかった時の処理
                        marker.addEventListener('markerFound', () => {
                            audio.currentTime = 0;
                            audio.play().catch(e => console.error(`[${day}] Audio play failed:`, e));
                        });

                        // マーカーが失われた時の処理
                        marker.addEventListener('markerLost', () => {
                            audio.pause();
                            audio.currentTime = 0;
                        });
                    }
                });

                // グローバルなエラーハンドリング
                window.addEventListener('error', (e) => {
                    console.error('An error occurred:', e.error);
                    messageEl.textContent = 'エラーが発生しました。ページを更新してください。';
                });
            });
        </script>
    </body>
</html>
